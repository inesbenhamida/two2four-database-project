{% extends "base.html" %}

{% block title %}Modifier un abonné{% endblock %}

{% block content %}
<body>
    <h1 class="page-title">Modifier les informations d'un abonné</h1>
    <div class="form-container">
        <form method="POST" action="{{ url_for('modifier_abonne', id_abonne=abonne.id_abonne) }}" class="formulaire-modification">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" value="{{ abonne.nom }}" required><br>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" value="{{ abonne.prenom }}" required><br>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" value="{{ abonne.email }}" required><br>

            <label for="num_tel">Téléphone :</label>
            <input type="text" id="num_tel" name="num_tel" value="{{ abonne.num_tel if abonne.num_tel else '' }}"><br>

            <label for="mdp">Nouveau mot de passe :</label>
            <input type="password" id="mdp" name="mdp"><br>
            <p style="font-size: 0.9em; color: gray;">(Laissez vide pour conserver l'ancien mot de passe)</p>

            <button type="submit" class="bouton-principal">Enregistrer les modifications</button>
        </form>
        <a href="{{ url_for('abonnes') }}" class="bouton-retour">Retour à la liste des abonnés</a>
    </div>
</body>
{% endblock %}
